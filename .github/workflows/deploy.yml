name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci

      - name: Verify environment variables
        run: |
          echo "Checking required environment variables..."
          if [ -z "${{ secrets.NEXT_PUBLIC_API_HOST }}" ]; then
            echo "⚠️  WARNING: NEXT_PUBLIC_API_HOST is not set in GitHub secrets"
            echo "   Make sure it's set in Cloudflare Pages environment variables"
          else
            echo "✅ NEXT_PUBLIC_API_HOST is set"
          fi
          if [ -z "${{ secrets.NEXT_PUBLIC_API_PORT }}" ]; then
            echo "⚠️  WARNING: NEXT_PUBLIC_API_PORT is not set in GitHub secrets"
            echo "   Make sure it's set in Cloudflare Pages environment variables"
          else
            echo "✅ NEXT_PUBLIC_API_PORT is set"
          fi

      - name: Build Next.js app
        working-directory: ./ui
        run: |
          echo "Building Next.js app..."
          npm run build
          echo "Build completed. Checking output directory..."
          ls -la out/ | head -20
        env:
          NEXT_PUBLIC_API_HOST: ${{ secrets.NEXT_PUBLIC_API_HOST }}
          NEXT_PUBLIC_API_PORT: ${{ secrets.NEXT_PUBLIC_API_PORT }}

      - name: Verify build output
        run: |
          echo "Verifying build output exists..."
          if [ ! -d "ui/out" ]; then
            echo "❌ Build output directory 'ui/out' does not exist"
            exit 1
          fi
          echo "✅ Build output directory exists"
          echo "Files in ui/out:"
          ls -la ui/out/ | head -20

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: alpaca
          directory: ui/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

